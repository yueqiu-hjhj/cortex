# Windows-only NDK linker override.
#
# Background: on Windows, the Tauri Android `gradle build` shell-out to
# `tauri android android-studio-script` (and `cc-rs` for ring/etc.) ends up
# picking up `ld.exe` from `C:\msys64\ucrt64\bin\` via PATH, which doesn't
# understand Android ELF options (`--eh-frame-hdr` etc.) and bails with
# `unrecognized option`.
#
# NDK 26 ships wrapper CMD shims (`aarch64-linux-android21-clang.cmd`) that
# dispatch to the right linker, but cargo's auto-detection of `aarch64-linux-
# android-clang` from PATH misses them because they are suffixed with the
# Android API level. Pinning `linker` here forces the right wrapper, and
# `ar = llvm-ar` avoids the same PATH-lookup problem for the archiver.
#
# This is harmless on non-Windows: macOS/Linux use the system clang directly
# and these settings are not read. If you build on a different machine with a
# different NDK path, override via the env vars below or edit the literal
# paths.
#
# Equivalent env-var form (works without this file):
#   CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=D:\android-sdk\ndk\26.3.11579264\toolchains\llvm\prebuilt\windows-x86_64\bin\aarch64-linux-android21-clang.cmd
#   CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=D:\android-sdk\ndk\26.3.11579264\toolchains\llvm\prebuilt\windows-x86_64\bin\llvm-ar.exe

[target.aarch64-linux-android]
linker = "D:/android-sdk/ndk/26.3.11579264/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang.cmd"
ar = "D:/android-sdk/ndk/26.3.11579264/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

[target.armv7-linux-androideabi]
linker = "D:/android-sdk/ndk/26.3.11579264/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi21-clang.cmd"
